<!-- Categories Management Page -->
<div class="page-header">
  <div class="page-title-group">
    <h1 class="page-title">Categories</h1>
    <p class="page-subtitle">Organize your products into categories</p>
  </div>
  <div class="page-actions">
    <button class="btn btn-primary" id="addCategoryBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      <span>Add Category</span>
    </button>
  </div>
</div>

<!-- Categories Table -->
<div class="card">
  <div class="card-body" style="padding: 0;">
    <div class="table-container">
      <table class="table" id="categoriesTable">
        <thead>
          <tr>
            <th>Category</th>
            <th>Slug</th>
            <th style="width: 140px;">Products</th>
            <th style="width: 180px;">Created</th>
            <th style="width: 140px;">Actions</th>
          </tr>
        </thead>
        <tbody id="categoriesBody">
          <tr>
            <td colspan="5" style="text-align: center; padding: 60px; color: var(--color-espresso-light);">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<!-- Category Modal -->
<div class="modal-overlay" id="categoryModal">
  <div class="modal" style="max-width: 480px;">
    <div class="modal-header">
      <h2 class="modal-title" id="categoryModalTitle">Add Category</h2>
      <button class="modal-close" aria-label="Close modal">&times;</button>
    </div>
    <form class="modal-body" id="categoryForm" novalidate>
      <input type="hidden" name="id" id="categoryId">
      
      <div class="form-group">
        <label class="form-label" for="categoryName">Category Name *</label>
        <input type="text" class="form-input" name="name" id="categoryName" required placeholder="e.g., Banarasi Silk">
      </div>
      
      <div class="form-group">
        <label class="form-label" for="categorySlug">Slug (URL-friendly) *</label>
        <input type="text" class="form-input" name="slug" id="categorySlug" required placeholder="e.g., banarasi">
        <p class="form-hint">Lowercase, letters, numbers, hyphens only. Used in URLs.</p>
      </div>
    </form>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" id="cancelCategoryBtn">Cancel</button>
      <button type="button" class="btn btn-primary" id="saveCategoryBtn">
        <span class="btn-text">Save Category</span>
        <span class="btn-loader" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal-overlay" id="deleteCategoryModal">
  <div class="modal" style="max-width: 420px;">
    <div class="modal-header">
      <h2 class="modal-title">Delete Category</h2>
      <button class="modal-close" aria-label="Close modal">&times;</button>
    </div>
    <div class="modal-body">
      <p style="color: var(--color-espresso-light);">Are you sure you want to delete <strong id="deleteCategoryName"></strong>?</p>
      <p class="form-hint" style="color: var(--color-warning);">Products in this category will be uncategorized.</p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" id="cancelDeleteCategoryBtn">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirmDeleteCategoryBtn">
        <span class="btn-text">Delete</span>
        <span class="btn-loader" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</div>

<script type="module">
import { supabase, getCategories, createCategory, updateCategory, deleteCategory, getProducts } from '../js/supabase-client.js';
import { showToast, openModal, closeModal, setButtonLoading, serializeForm, setFormValues, clearAllFormErrors, showFormError, escapeHtml, generateSlug } from './admin-core.js';

// State
let allCategories = [];
let categoryToDelete = null;

// DOM elements
const categoriesBody = document.getElementById('categoriesBody');
const addCategoryBtn = document.getElementById('addCategoryBtn');
const categoryModal = document.getElementById('categoryModal');
const categoryForm = document.getElementById('categoryForm');
const categoryModalTitle = document.getElementById('categoryModalTitle');
const cancelCategoryBtn = document.getElementById('cancelCategoryBtn');
const saveCategoryBtn = document.getElementById('saveCategoryBtn');
const deleteCategoryModal = document.getElementById('deleteCategoryModal');
const deleteCategoryName = document.getElementById('deleteCategoryName');
const cancelDeleteCategoryBtn = document.getElementById('cancelDeleteCategoryBtn');
const confirmDeleteCategoryBtn = document.getElementById('confirmDeleteCategoryBtn');
const categoryNameInput = document.getElementById('categoryName');
const categorySlugInput = document.getElementById('categorySlug');

// Initialize
async function init() {
  await loadCategories();
  setupEventListeners();
}

async function loadCategories() {
  try {
    categoriesBody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 60px; color: var(--color-espresso-light);">Loading...</td></tr>';
    allCategories = await getCategories();
    
    // Get product counts for each category
    const products = await getProducts({ visibleOnly: false });
    const counts = {};
    products.forEach(p => {
      if (p.category_id) counts[p.category_id] = (counts[p.category_id] || 0) + 1;
    });
    
    allCategories = allCategories.map(cat => ({ ...cat, productCount: counts[cat.id] || 0 }));
    renderCategories();
  } catch (err) {
    console.error('Failed to load categories:', err);
    showToast('Failed to load categories', 'error');
    categoriesBody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 60px; color: var(--color-error);">Failed to load categories</td></tr>';
  }
}

function renderCategories() {
  if (!allCategories.length) {
    categoriesBody.innerHTML = `
      <tr>
        <td colspan="5" style="text-align: center; padding: 60px; color: var(--color-espresso-light);">
          No categories yet. <button class="btn btn-primary btn-sm" id="firstCategoryBtn">Add your first category</button>
        </td>
      </tr>
    `;
    document.getElementById('firstCategoryBtn')?.addEventListener('click', openAddCategoryModal);
    return;
  }
  
  categoriesBody.innerHTML = allCategories.map(cat => `
    <tr data-id="${cat.id}">
      <td>
        <div style="font-weight: 500;">${escapeHtml(cat.name)}</div>
      </td>
      <td><code style="font-size: 0.8rem; background: var(--color-cream); padding: 2px 6px; border-radius: 4px;">${escapeHtml(cat.slug)}</code></td>
      <td>
        <span class="badge badge-info">${cat.productCount} product${cat.productCount !== 1 ? 's' : ''}</span>
      </td>
      <td style="font-size: 0.85rem; color: var(--color-espresso-light);">${new Date(cat.created_at).toLocaleDateString('en-IN', {day: 'numeric', month: 'short', year: 'numeric'})}</td>
      <td class="actions-cell">
        <button class="action-btn edit-category-btn" data-id="${cat.id}" title="Edit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="action-btn delete delete-category-btn" data-id="${cat.id}" title="Delete">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </td>
    </tr>
  `).join('');
  
  categoriesBody.querySelectorAll('.edit-category-btn').forEach(btn => {
    btn.addEventListener('click', () => openEditCategoryModal(btn.dataset.id));
  });
  categoriesBody.querySelectorAll('.delete-category-btn').forEach(btn => {
    btn.addEventListener('click', () => openDeleteCategoryModal(btn.dataset.id));
  });
}

function setupEventListeners() {
  addCategoryBtn.addEventListener('click', openAddCategoryModal);
  
  cancelCategoryBtn.addEventListener('click', () => closeModal('categoryModal'));
  categoryModal.querySelector('.modal-close').addEventListener('click', () => closeModal('categoryModal'));
  categoryForm.addEventListener('submit', (e) => { e.preventDefault(); saveCategory(); });
  
  // Auto-generate slug from name
  categoryNameInput.addEventListener('input', () => {
    if (!categorySlugInput.dataset.manual) {
      categorySlugInput.value = generateSlug(categoryNameInput.value);
    }
  });
  categorySlugInput.addEventListener('input', () => {
    categorySlugInput.dataset.manual = 'true';
  });
  
  cancelDeleteCategoryBtn.addEventListener('click', () => closeModal('deleteCategoryModal'));
  deleteCategoryModal.querySelector('.modal-close').addEventListener('click', () => closeModal('deleteCategoryModal'));
  confirmDeleteCategoryBtn.addEventListener('click', confirmDeleteCategory);
}

function openAddCategoryModal() {
  categoryForm.reset();
  document.getElementById('categoryId').value = '';
  categorySlugInput.dataset.manual = '';
  categoryModalTitle.textContent = 'Add Category';
  clearAllFormErrors(categoryForm);
  openModal('categoryModal');
  categoryNameInput.focus();
}

function openEditCategoryModal(categoryId) {
  const category = allCategories.find(c => c.id === categoryId);
  if (!category) return;
  
  categoryForm.reset();
  categoryModalTitle.textContent = 'Edit Category';
  
  setFormValues(categoryForm, {
    id: category.id,
    name: category.name,
    slug: category.slug
  });
  categorySlugInput.dataset.manual = 'true';
  clearAllFormErrors(categoryForm);
  openModal('categoryModal');
  categoryNameInput.focus();
}

async function saveCategory() {
  clearAllFormErrors(categoryForm);
  
  const formData = serializeForm(categoryForm);
  const errors = {};
  
  if (!formData.name?.trim()) errors.name = 'Category name is required';
  if (!formData.slug?.trim()) errors.slug = 'Slug is required';
  else if (!/^[a-z0-9-]+$/.test(formData.slug)) errors.slug = 'Slug can only contain lowercase letters, numbers, and hyphens';
  
  // Check duplicate slug
  const existingSlug = allCategories.find(c => c.slug === formData.slug && c.id !== formData.id);
  if (existingSlug) errors.slug = 'This slug is already in use';
  
  if (Object.keys(errors).length) {
    Object.entries(errors).forEach(([field, msg]) => {
      const input = categoryForm.querySelector(`[name="${field}"]`);
      if (input) showFormError(input, msg);
    });
    showToast('Please fix the errors above', 'error');
    return;
  }
  
  setButtonLoading(saveCategoryBtn, true);
  
  try {
    const categoryId = formData.id;
    const isNew = !categoryId;
    
    const categoryData = {
      name: formData.name.trim(),
      slug: formData.slug.trim().toLowerCase()
    };
    
    if (isNew) {
      await createCategory(categoryData);
    } else {
      await updateCategory(categoryId, categoryData);
    }
    
    showToast(`Category ${isNew ? 'created' : 'updated'} successfully`, 'success');
    closeModal('categoryModal');
    await loadCategories();
  } catch (err) {
    console.error('Save category error:', err);
    if (err.message?.includes('duplicate') || err.code === '23505') {
      showToast('A category with this slug already exists', 'error');
      showFormError(categorySlugInput, 'This slug is already in use');
    } else {
      showToast(`Failed to save category: ${err.message}`, 'error');
    }
  } finally {
    setButtonLoading(saveCategoryBtn, false);
  }
}

function openDeleteCategoryModal(categoryId) {
  const category = allCategories.find(c => c.id === categoryId);
  if (!category) return;
  categoryToDelete = categoryId;
  deleteCategoryName.textContent = category.name;
  openModal('deleteCategoryModal');
}

async function confirmDeleteCategory() {
  if (!categoryToDelete) return;
  
  setButtonLoading(confirmDeleteCategoryBtn, true);
  
  try {
    await deleteCategory(categoryToDelete);
    showToast('Category deleted successfully', 'success');
    closeModal('deleteCategoryModal');
    await loadCategories();
  } catch (err) {
    console.error('Delete category error:', err);
    showToast('Failed to delete category', 'error');
  } finally {
    setButtonLoading(confirmDeleteCategoryBtn, false);
    categoryToDelete = null;
  }
}

init();
</script>
